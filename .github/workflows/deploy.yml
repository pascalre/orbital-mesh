name: Build and Push Images

on:
  push:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          build-args: |
            VITE_SOLACE_URL=${{ secrets.SOLACE_URL }}
            VITE_SOLACE_VPN=${{ secrets.SOLACE_VPN }}
            VITE_SOLACE_USER=${{ secrets.SOLACE_USER }}
            VITE_SOLACE_PASSWORD=${{ secrets.SOLACE_PASSWORD }}

      - name: Build and push Orbital Emitter
        uses: docker/build-push-action@v5
        with:
          context: ./services/orbital-emitter
          push: true
          tags: ghcr.io/${{ github.repository }}/orbital-emitter:latest