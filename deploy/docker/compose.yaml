services:
  orbital-emitter:
    image: ghcr.io/pascalre/orbital-mesh/orbital-emitter:latest
    limits:
      cpus: 1
      memory: 512M
    restart: unless-stopped
    env_file: .env
    environment:
      CACHE_DIR: /data
      CELESTRAK_GROUP: ACTIVE
      CATALOG_REFRESH_INTERVAL: 24h   # once a day
      CATALOG_RETRY_BASE: 2h          # min wait after a failed download (CelesTrak data changes every 2h)
    volumes:
      - emitter-cache:/data
    labels:
      - com.centurylink.watchtower.enable=true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    image: ghcr.io/pascalre/orbital-mesh/web:latest
    restart: unless-stopped
    ports:
      - "5173:80"
    labels:
      - com.centurylink.watchtower.enable=true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]

  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"      # only touch containers with the label above
      WATCHTOWER_POLL_INTERVAL: "300"      # seconds
      WATCHTOWER_CLEANUP: "true"           # remove old images
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  emitter-cache:
